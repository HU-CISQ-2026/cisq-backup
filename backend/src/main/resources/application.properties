
# Wijzig dit voor productie!
security.jwt.secret=this-is-a-512-bit-key-used-for-signing-jwt-tokens-that-should-be-changed-production

# 864000000 ms = 10 dagen
security.jwt.expiration-in-ms = 864000000

# Instellingen voor H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Instellingen voor PostgreSQL
#spring.datasource.url=jdbc:postgresql://localhost:15432/hu-s3-backend
#spring.datasource.username=hu-s3-backend-dbadmin
#spring.datasource.password=hu-s3-backend-pwd


# Laat Hibernate tabellen genereren of bijwerken
# op basis van de gedefinieerde entiteiten.
# Complexere applicaties gebruiken voor de onderhoudbaarheid vaak
# een databasemigratietool, zoals Flyway.
spring.jpa.hibernate.ddl-auto=create

# Schakel logging van JPA-query's in
